[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dss-mcp-server"
version = "0.1.0"
description = "Read-only MCP server for Dataiku DSS demo project discovery"
requires-python = ">=3.11"
dependencies = [
    "dataiku-api-client",
    "fastmcp>=2.0",
    "requests>=2.31",
]

[project.scripts]
dss-mcp-server = "dss_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/dss_mcp"]
